
name: AI Detection

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-detection:
    name: AI Detection
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify Java and Ant
        run: |
          java -version
          javac -version
          ant -version

      - name: Install Apache Ivy
        run: |
          mkdir -p "$HOME/.ant/lib"
          wget -O "$HOME/.ant/lib/ivy-2.5.2.jar" https://repo.maven.apache.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar
          ls -lh "$HOME/.ant/lib/ivy-2.5.2.jar"

      - name: Verify JPlag
        run: |
          if [ -f tools/jplag/jplag-6.2.0-jar-with-dependencies.jar ]; then
            java -jar tools/jplag/jplag-6.2.0-jar-with-dependencies.jar --help
          else
            echo "JPlag not installed. Comparison will be skipped."
          fi

      - name: Run AI Detection
        id: detection
        continue-on-error: true
        run: |
          ant -lib "$HOME/.ant/lib" -noinput -buildfile build.xml copy-dependencies ai-pattern-check jplag-check

      - name: Upload AI Detection Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-detection-reports
          path: build/reports/slop/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare PR Detection Report
        if: always() && github.event_name == 'pull_request'
        run: |
          REPORT="build/reports/slop/ai-pattern-report.txt"
          mkdir -p build/reports/slop

          {
            echo "<!-- AI-DETECTION-REPORT -->"
            echo "## AI Detection Report"
            echo ""

            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            else
              echo "**Verdict:** Detection report was not generated."
              echo ""
              echo "The Ant detection process may have failed before generating the report."
              echo "Check the AI Detection workflow logs for the exact error."
            fi

            echo ""
            echo "---"
            echo "Automated analysis only. This report does not prove AI authorship."
          } > build/reports/slop/pr-comment.md

      - name: Comment AI Detection Report on Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const reportPath = 'build/reports/slop/pr-comment.md';
            const marker = '<!-- AI-DETECTION-REPORT -->';

            let report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : `${marker}\n## AI Detection Report\n\nReport unavailable. Check the workflow logs.`;

            const maxLength = 60000;
            if (report.length > maxLength) {
              report = report.substring(0, maxLength) +
                '\n\n_Report truncated. See workflow artifacts for the complete report._';
            }

            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              }
            );

            const existingComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: report
              });
            }

      - name: Fail Pull Request if AI Detection Fails
        if: steps.detection.outcome == 'failure'
        run: |
          echo "AI Detection failed or exceeded the configured score threshold."
          exit 1
