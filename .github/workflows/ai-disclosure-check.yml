# =============================================================================
# AI Disclosure Check (with threshold)
# =============================================================================
# Purpose:
#   Gives a pull request an "AI score" from 0 to 100 based on signals found in
#   the commits and in the added Java code. If the score reaches the threshold,
#   the job shows a warning (or fails, if FAIL_ON_THRESHOLD is true).
#
# Scoring:
#   +50  AI marker in the commit history (author, email, message, trailer)
#   +50  AI disclosure comment in the added Java lines
#   +10  A single commit that adds more than LARGE_COMMIT_LINES lines
#
# Settings (see the env block of the step):
#   THRESHOLD          Score that triggers the warning. Set to 20.
#   FAIL_ON_THRESHOLD  "true" makes the job fail at or above the threshold.
#   LARGE_COMMIT_LINES Lines added by one commit to count as "large".
#
# What the code patterns match (case-insensitive):
#   "generated by ChatGPT", "written with Claude", "created using AI",
#   "AI-generated", "as an AI language model"
#
# Debugging:
#   The log prints how many commits and added Java lines were scanned. If both
#   are 0, the job is reading the wrong range, not failing to detect.
#
# Limits:
#   The weights are our own choice, not a validated measure. The score is not
#   a probability and not proof. It only detects markers left in the history
#   or the code. Do not use it alone to accuse anyone.
# =============================================================================

name: ai-disclosure-check

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  detect-ai:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download the code with the full commit history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Calculate the score and compare it with the threshold.
      - name: Calculate AI score
        env:
          BASE_REF: ${{ github.base_ref }}
          THRESHOLD: '20'
          FAIL_ON_THRESHOLD: 'false'
          LARGE_COMMIT_LINES: '300'
        run: |
          SCORE=0
          COMMIT_PTS=0
          CODE_PTS=0
          LARGE_PTS=0

          COMMIT_COUNT=$(git rev-list --count "origin/${BASE_REF}..HEAD")
          echo "Scanning ${COMMIT_COUNT} commit(s) against origin/${BASE_REF}"

          COMMIT_PATTERN='co-authored-by:.*\b(claude|copilot|codex|cursor|gemini|chatgpt|openai|anthropic)\b|generated with|aider:|noreply@anthropic\.com|\[bot\]'
          COMMIT_MATCHES=$(git log "origin/${BASE_REF}..HEAD" --format='%h %an <%ae>%n%B' | grep -Ei "$COMMIT_PATTERN" || true)
          if [ -n "$COMMIT_MATCHES" ]; then
            COMMIT_PTS=50
            echo "+50 AI marker in commit history:"
            echo "$COMMIT_MATCHES"
          fi

          ADDED_LINES=$(git diff "origin/${BASE_REF}...HEAD" -U0 -- '*.java' | grep -E '^\+([^+]|$)' || true)
          ADDED_COUNT=$(printf '%s\n' "$ADDED_LINES" | grep -c . || true)
          echo "Added Java lines scanned: ${ADDED_COUNT}"

          CODE_PATTERN='\b(generated|written|created|assisted|made|produced)[ -]+(by|with|using)[ -]+(chatgpt|claude|copilot|gemini|codex|cursor|gpt|ai)\b|\bai[- ]generated\b|as an ai language model'
          CODE_MATCHES=$(printf '%s\n' "$ADDED_LINES" | grep -Ei "$CODE_PATTERN" || true)
          if [ -n "$CODE_MATCHES" ]; then
            CODE_PTS=50
            echo "+50 AI disclosure in added code:"
            echo "$CODE_MATCHES"
          fi

          for c in $(git rev-list "origin/${BASE_REF}..HEAD"); do
            ADDED=$(git show --numstat --format= "$c" | awk '{s+=$1} END {print s+0}')
            if [ "$ADDED" -gt "$LARGE_COMMIT_LINES" ]; then
              LARGE_PTS=10
              echo "Large commit ${c}: ${ADDED} lines added"
            fi
          done
          if [ "$LARGE_PTS" -gt 0 ]; then
            echo "+10 large commit"
          fi

          SCORE=$((COMMIT_PTS + CODE_PTS + LARGE_PTS))
          if [ "$SCORE" -gt 100 ]; then
            SCORE=100
          fi

          echo "AI score: ${SCORE}/100 (threshold: ${THRESHOLD})"
          {
            echo "### AI disclosure check"
            echo ""
            echo "Score: **${SCORE}/100**, threshold: **${THRESHOLD}**"
            echo ""
            echo "| Signal | Points |"
            echo "|---|---|"
            echo "| AI marker in commits | ${COMMIT_PTS} |"
            echo "| AI disclosure in added code | ${CODE_PTS} |"
            echo "| Large commit | ${LARGE_PTS} |"
            echo ""
            echo "Scanned ${COMMIT_COUNT} commit(s) and ${ADDED_COUNT} added Java line(s)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SCORE" -ge "$THRESHOLD" ]; then
            echo "::warning::AI score ${SCORE} is at or above the threshold ${THRESHOLD}"
            if [ "$FAIL_ON_THRESHOLD" = "true" ]; then
              exit 1
            fi
          else
            echo "AI score is below the threshold"
          fi