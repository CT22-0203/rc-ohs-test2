name: AI Detection

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ai-detection:
    name: AI Detection
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify Java and Ant
        run: |
          java -version
          javac -version
          ant -version

      - name: Install Apache Ivy
        run: |
          mkdir -p "$HOME/.ant/lib"
          wget -O "$HOME/.ant/lib/ivy-2.5.2.jar" https://repo.maven.apache.org/maven2/org/apache/ivy/ivy/2.5.2/ivy-2.5.2.jar
          ls -lh "$HOME/.ant/lib/ivy-2.5.2.jar"

      - name: Verify JPlag
        run: |
          if [ -f tools/jplag/jplag-6.2.0-jar-with-dependencies.jar ]; then
            java -jar tools/jplag/jplag-6.2.0-jar-with-dependencies.jar --help
          else
            echo "JPlag not installed. Comparison will be skipped."
          fi

      - name: Resolve Ivy dependencies and Run AI Detection
        run: ant -lib "$HOME/.ant/lib" copy-dependencies ai-pattern-check jplag-check

      - name: Upload AI Detection Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-detection-reports
          path: build/reports/slop/
          if-no-files-found: warn
          retention-days: 30